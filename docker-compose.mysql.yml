services:
  mysql:
    image: mysql:8.4
    container_name: hoi-business-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: hoi_root_password
      MYSQL_DATABASE: hoi_business_center
      MYSQL_USER: hoi_user
      MYSQL_PASSWORD: hoi_password
    ports:
      - "3307:3306"
    volumes:
      - hoi_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  hoi_mysql_data:
